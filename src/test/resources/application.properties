# Propiedades para tests. El DataSource lo sobrescribe Testcontainers via
# @DynamicPropertySource (IntegrationTestBase); aqui solo van los valores que
# el contexto necesita para levantar y que no dependen de la base.

# El contrato de API usa snake_case en todo el JSON (igual que en main).
spring.jackson.property-naming-strategy=SNAKE_CASE

# La guarda de arranque de ZonaHorariaGuard exige TZ=UTC (ver Dockerfile). La
# maquina que corre los tests no tiene por que estar en UTC: aqui se desactiva
# la guarda para no bloquear el contexto de Spring en cada test; en produccion
# (Docker) la JVM SI esta en UTC y la guarda pasa igual, active o no.
app.exigir-utc=false

# Secreto JWT de prueba (>= 256 bits). NO es un secreto real.
app.security.jwt.secret=test-jwt-secret-0123456789abcdef0123456789abcdef
app.security.jwt.access-expiration-ms=3600000
app.security.jwt.refresh-expiration-ms=604800000
app.security.cors.allowed-origins=http://localhost:5173

# ── Google Drive ───────────────────────────────────────────
# Service Account FALSO, con una clave RSA generada solo para tests. No da
# acceso a nada: existe para que el contexto de Spring levante sin red.
app.drive.credentials-
app.drive.root-folder-id=0ATestSharedDriveId
