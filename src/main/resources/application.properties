# ── Datasource ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quantum_crm}
spring.datasource.username=${DB_USERNAME:quantum}
spring.datasource.password=${DB_PASSWORD:quantum}

# ── JPA / Hibernate ────────────────────────────────────────
# Hibernate NUNCA modifica el schema: solo valida. Flyway es el unico
# que toca la base de datos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Jackson ────────────────────────────────────────────────
# El contrato de API usa snake_case en todo el JSON (contrato_api.md §1).
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Seguridad: JWT y CORS (SECURITY-backend.md §2, §7) ─────
# El secreto NUNCA se hardcodea: es obligatorio via env JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Cookie Secure: true en produccion; poner false solo para dev local sobre http.
app.security.cookie.secure=${COOKIE_SECURE:true}

# ── Google Drive: Headless Storage ─────────────────────────
# El JSON del Service Account viaja en base64 por env, nunca en disco ni en el repo.
# root-folder-id DEBE ser una unidad compartida (empieza en 0A): una cuenta de
# servicio no tiene cuota propia y no puede ser duena de archivos en "Mi unidad".
app.drive.credentials-base64=${GOOGLE_DRIVE_CREDENTIALS_BASE64:}
app.drive.root-folder-id=${ROOT_DRIVE_FOLDER_ID:}
app.drive.upload-chunk-size-bytes=${DRIVE_UPLOAD_CHUNK_SIZE_BYTES:5242880}
app.drive.max-file-size-bytes=${DRIVE_MAX_FILE_SIZE_BYTES:104857600}
app.drive.connect-timeout-ms=${DRIVE_CONNECT_TIMEOUT_MS:10000}
# Timeout de lectura de las SUBIDAS: alto a proposito, un archivo grande tarda.
# Esa ruta no corre dentro de ninguna transaccion de base de datos.
app.drive.read-timeout-ms=${DRIVE_READ_TIMEOUT_MS:120000}
# Timeout de lectura de la CREACION DE CARPETAS: es una llamada de metadatos y es
# la unica operacion de Drive que todavia puede quedar dentro de una transaccion
# (POST /oportunidades, exigido por contrato_api.md §8). Con los 120 s de las
# subidas, una caida de Drive retenia conexiones de Hikari hasta 2 minutos.
app.drive.folder-read-timeout-ms=${DRIVE_FOLDER_READ_TIMEOUT_MS:15000}

# ── Multipart ──────────────────────────────────────────────
# Tope de guarda del contenedor. La ruta de subida a Drive NO pasa por el
# resolver de Spring (ver DriveUploadMultipartResolver): se parsea en streaming
# para que el archivo nunca se vuelque a un temporal en disco.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# ── Apagado ordenado ───────────────────────────────────────
# En cada redespliegue la plataforma manda SIGTERM. Sin esto el proceso muere de
# golpe y las peticiones en vuelo se cortan; con esto deja de aceptar nuevas y
# espera a que terminen las que ya estaban dentro.
# El margen debe ser menor que el que la plataforma da antes del SIGKILL (30s en
# Render), o el apagado ordenado no llega a completarse.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# ── Pool de conexiones ─────────────────────────────────────
# El default de Hikari son 10 conexiones. Conviene fijarlo por entorno: el plan
# gestionado de PostgreSQL tiene un tope de conexiones y varias instancias de la
# app comparten ese tope.
# Las llamadas a Google Drive ya NO ocurren dentro de una transaccion, salvo la
# creacion de la subcarpeta en POST /oportunidades, que el contrato obliga a
# mantener atomica con el insert. Esa unica excepcion queda acotada por
# app.drive.folder-read-timeout-ms (15 s), no por los 120 s de las subidas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

# ── Sondas de salud ────────────────────────────────────────
# Separa liveness de readiness. Durante el apagado ordenado la readiness pasa a
# OUT_OF_SERVICE antes de que el proceso muera, que es lo que permite a la
# plataforma sacar la instancia del balanceador sin perder peticiones.
management.endpoint.health.probes.enabled=true

# ── Tipo de cambio SUNAT (proveedor Decolecta) ─────────────
# La API key es un secreto: viaja SIEMPRE por DECOLECTA_API_KEY y nunca se
# escribe aqui (CLAUDE.md regla 13). En blanco la integracion queda apagada y el
# cliente devuelve null sin llamar, con fallback al ultimo valor guardado.
app.sunat.url=${SUNAT_TIPO_CAMBIO_URL:https://api.decolecta.com/v1/tipo-cambio/sunat}
app.sunat.api-key=${DECOLECTA_API_KEY:}
app.sunat.timeout-segundos=${SUNAT_TIMEOUT_SEGUNDOS:10}
