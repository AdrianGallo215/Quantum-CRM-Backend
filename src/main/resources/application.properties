# ── Datasource ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quantum_crm}
spring.datasource.username=${DB_USERNAME:quantum}
spring.datasource.password=${DB_PASSWORD:quantum}

# ── JPA / Hibernate ────────────────────────────────────────
# Hibernate NUNCA modifica el schema: solo valida. Flyway es el unico
# que toca la base de datos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
