# El build de CodeQL (Analyze java-kotlin, autobuild) fallaba con
# OOMErrorException del compilador Kotlin: sin este archivo, Gradle usa su heap
# por defecto, insuficiente cuando se le suma la instrumentacion de CodeQL sobre
# una compilacion normal.
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvm.options=-Xmx4g
