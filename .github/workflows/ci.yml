name: Backend CI

# Corre en cada PR y en cada push a develop/main (DEVOPS-backend.md §3).
# Gatea el merge con los checks rapidos por-commit. El escaneo de dependencias
# (OWASP Dependency-Check) NO vive aqui: corre en security-scan.yml (nocturno +
# manual) porque la NVD publica es inestable y no debe bloquear cada merge.
on:
  pull_request:
  push:
    branches: [develop, main]

# Cancela corridas anteriores del mismo PR/rama para no gastar minutos de CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Cachea dependencias y el daemon de Gradle entre corridas.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Fail fast: los checks mas rapidos primero (DEVOPS-backend.md §3) ──

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Compile
        run: ./gradlew compileKotlin --no-daemon

      # Tests con Testcontainers (Docker disponible en el runner) + ArchUnit.
      - name: Tests
        run: ./gradlew test --no-daemon

      # Cobertura: falla si baja del umbral (90% dominio, 75% global).
      - name: Coverage check (Kover)
        run: ./gradlew koverVerify --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/
          if-no-files-found: ignore
